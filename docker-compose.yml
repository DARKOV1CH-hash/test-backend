services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_KEY: base64:lMhkXPaDTa1IwSbYvoZyxV3mqwoSJedzL0AAg7nywIs=
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: postback_db
      DB_USERNAME: postback
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PARTNER_API_URL: http://mock:8080/partner
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/var/www/storage

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: postback_db
      MYSQL_USER: postback
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "postback", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  mock:
    image: mockserver/mockserver:latest
    ports:
      - "8080:8080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock.json
    volumes:
      - ./docker/mock.json:/config/mock.json

volumes:
  mysql_data:
  redis_data:
